name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.10.*'   # latest 6.10 patch release
  QT_MODULES: 'qtmultimedia'

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-cursor0 libegl1 libpulse0 libfontconfig1 ffmpeg

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          IPTV_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
          # Real stream that drops: checks automatic reconnecting.
          IPTV_STREAM_TEST: "1"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: screenshots/
          if-no-files-found: ignore

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'   # no FUSE on the runner
          QML_SOURCES_PATHS: ${{ github.workspace }}/src/qml
        run: |
          VERSION=$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          cmake -S . -B build-appimage -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DIPTV_BUILD_TESTS=OFF
          cmake --build build-appimage
          DESTDIR="$PWD/AppDir" cmake --install build-appimage
          base=https://github.com/linuxdeploy
          curl -sSLo linuxdeploy "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          curl -sSLo linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          # Only SQLite is used. The other database drivers need client libraries
          # that aren't installed, which makes linuxdeploy fail.
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name 'libqsql*.so' ! -name 'libqsqlite.so' -print -delete
          # Wayland (and X11) support inside the AppImage: whatever this Qt has
          ls "$QT_ROOT_DIR/plugins/platforms"
          EXTRA_PLATFORM_PLUGINS=$(cd "$QT_ROOT_DIR/plugins/platforms" && ls libqwayland*.so libqxcb.so 2>/dev/null | paste -sd ';')
          export EXTRA_PLATFORM_PLUGINS
          if [ -e "$QT_ROOT_DIR/lib/libQt6WaylandClient.so.6" ]; then export EXTRA_QT_MODULES=waylandclient; fi
          echo "Platform plugins: $EXTRA_PLATFORM_PLUGINS"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy --appdir AppDir --plugin qt \
            --desktop-file AppDir/usr/share/applications/io.github.sadikbr.iptvplayer.desktop \
            --icon-file assets/icon/hicolor/256x256/apps/io.github.sadikbr.iptvplayer.png
          # The video engine (FFmpeg plugin) and the libraries it loads
          mkdir -p AppDir/usr/plugins/multimedia
          cp -n "$QT_ROOT_DIR"/plugins/multimedia/*.so AppDir/usr/plugins/multimedia/
          for lib in "$QT_ROOT_DIR"/lib/libav*.so* "$QT_ROOT_DIR"/lib/libsw*.so*; do
            [ -e "$lib" ] && cp -an "$lib" AppDir/usr/lib/
          done
          LDAI_OUTPUT="IPTVPlayer-x86_64.AppImage" LINUXDEPLOY_OUTPUT_VERSION="$VERSION" \
            ./linuxdeploy --appdir AppDir --output appimage
          mkdir -p dist && mv IPTVPlayer-x86_64.AppImage dist/
          ls -la dist

      - name: Check the AppImage starts
        run: |
          cd dist
          ./IPTVPlayer-x86_64.AppImage --appimage-extract > /dev/null
          QT_QPA_PLATFORM=offscreen IPTV_SMOKE_PLAYLIST="$GITHUB_WORKSPACE/tests/fixtures/playlist.m3u" \
            timeout 120 squashfs-root/AppRun --smoke-test
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-linux-x86_64
          path: dist/IPTVPlayer-x86_64.AppImage

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/IPTVPlayer | Out-Null
          Copy-Item build/bin/IPTVPlayer.exe dist/IPTVPlayer/
          windeployqt --release --qmldir src/qml --no-translations --no-system-d3d-compiler `
            dist/IPTVPlayer/IPTVPlayer.exe
          Compress-Archive -Path dist/IPTVPlayer -DestinationPath dist/IPTVPlayer-windows-x64.zip

      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" `
            "/DSourceDir=$PWD\dist\IPTVPlayer" "/DOutputDir=$PWD\dist" installer\windows\iptvplayer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-windows-x64
          path: |
            dist/IPTVPlayer-windows-x64.zip
            dist/IPTVPlayer-setup-x64.exe

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: '27.2.12479018'   # r27c, required by Qt 6.10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Qt (host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          dir: ${{ runner.temp }}
          cache: true
          cache-key-prefix: qt-android-host
          set-env: false

      - name: Install Qt (Android arm64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os  # Qt >= 6.7 publishes Android packages under all_os
          target: android
          arch: android_arm64_v8a
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          cache: true
          cache-key-prefix: qt-android-arm64
          set-env: false

      - name: Install Qt (Android armv7)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os  # Qt >= 6.7 publishes Android packages under all_os
          target: android
          arch: android_armv7
          modules: ${{ env.QT_MODULES }}
          dir: ${{ runner.temp }}
          cache: true
          cache-key-prefix: qt-android-armv7
          set-env: false

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using the release keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set. Signing with a temporary key;"\
                 "installing a newer build will require uninstalling the old one first."
            KEYSTORE_PASSWORD=temporary
            KEY_ALIAS=iptvplayer
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" -keyalg RSA \
              -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEYSTORE_PASSWORD" -dname "CN=IPTV Player"
          fi
          {
            echo "QT_ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "QT_ANDROID_KEYSTORE_ALIAS=$KEY_ALIAS"
            echo "QT_ANDROID_KEYSTORE_STORE_PASS=$KEYSTORE_PASSWORD"
            echo "QT_ANDROID_KEYSTORE_KEY_PASS=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      # OpenSSL for https on Android (KDAB's prebuilt libraries, pinned commit)
      - name: Get OpenSSL for Android
        run: |
          git init -q "$RUNNER_TEMP/android_openssl"
          cd "$RUNNER_TEMP/android_openssl"
          git fetch -q --depth 1 https://github.com/KDAB/android_openssl.git b71f1470962019bd89534a2919f5925f93bc5779
          git checkout -q FETCH_HEAD
          ls ssl_3

      - name: Configure
        run: |
          QT_BASE=$(ls -d "$RUNNER_TEMP"/Qt/6.* | sort -V | tail -n 1)
          echo "Using Qt from $QT_BASE"
          "$QT_BASE/android_arm64_v8a/bin/qt-cmake" -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_BASE/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DQT_ANDROID_ABIS="arm64-v8a;armeabi-v7a" \
            -DQT_ANDROID_SIGN_APK=ON \
            -DIPTV_ANDROID_VERSION_CODE=${{ github.run_number }} \
            -DIPTV_ANDROID_OPENSSL_DIR="$RUNNER_TEMP/android_openssl"

      - name: Build APK
        run: |
          cmake --build build --target apk
          APK=$(find build -path '*outputs/apk*' -name '*.apk' | head -n 1)
          echo "Built: $APK"
          # https needs OpenSSL inside the APK
          unzip -l "$APK" | grep -E "lib(ssl|crypto)_3\.so" || { echo "::error::OpenSSL missing from the APK"; exit 1; }
          mkdir -p dist && cp "$APK" dist/IPTVPlayer-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPlayer-android
          path: dist/IPTVPlayer-android.apk

  # Publishes the GitHub Release for the version in CMakeLists.txt, once:
  # on a push to main whose CHANGELOG.md has a section for that version and
  # no release exists yet. The tag is created here. The app's automatic
  # updates install these releases. Work in progress sits under
  # "## Unreleased" and is not published.
  release:
    name: Publish release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Version and release notes
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^ *VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          awk -v tag="## ${TAG}" '
            $0 == tag { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section '## ${TAG}' yet: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing ${TAG}:"
            cat release-notes.md
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          path: artifacts
          pattern: IPTVPlayer-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: IPTV Player ${{ steps.version.outputs.tag }}
          files: artifacts/*
          body_path: release-notes.md
